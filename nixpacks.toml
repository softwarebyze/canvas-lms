# System dependencies ONLY (no Ruby - rbenv handles that)
[phases.setup]
aptPkgs = [
  "zlib1g-dev",       # Compression
  "libxml2-dev",      # XML parsing
  "postgresql",       # PostgreSQL client
  "libpq-dev",        # PostgreSQL dev headers
  "libxmlsec1-dev",   # XML security (SAML)
  "libyaml-dev",      # YAML parsing
  "libidn11-dev",     # International domains
  "build-essential",  # gcc, make, etc
  "libreadline-dev",  # Terminal input
  "libncurses5-dev",  # Terminal UI
  "libffi-dev",       # Foreign function interface
  "libgdbm-dev",      # GNU dbm
  "shared-mime-info", # MIME database (mimemagic gem)
  "git-core",         # Git
]

# Copy configs + compile assets
[phases.build]
cmds = [
  "cp config/database.yml.sevalla config/database.yml",
  "cp config/redis.yml.sevalla config/redis.yml",
  "RAILS_ENV=production bundle exec rake canvas:compile_assets",
]

# Production server
[start]
cmd = "bundle exec puma -C config/puma.rb"
